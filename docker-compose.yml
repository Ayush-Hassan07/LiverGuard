services:
  ml-service:
    build: ./ml-service
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
  api:
    build: ./backend
    ports: ["5000:5000"]
    environment:
      MlServiceUrl: http://ml-service:8000
    depends_on:
      ml-service:
        condition: service_healthy
